# nanomq-only — bare NanoMQ. RQ2 μ_broker isolation.
# load_gen publishes directly into the broker; no Coordinator on the
# subscribe side. Broker still needs vault42+postgres? No — NanoMQ is
# self-contained (auth via local cred file from nanomq-credentials).
namespace: hermod-prod
scale:
  hermod-coordinator: 0
  nanomq: 1
  vault42: 0
  postgres: 1
  lora2mqtt: 0
  wifi2mqtt: 0
  zigbee2mqtt: 0
  omg-ble: 0
