# translator-zigbee — ZigBee2MQTT + NanoMQ, no Coordinator.
# Characterise the ZB translator's USB→MQTT path independently of the
# rule engine. Real ZBDongle Plus V2 (EmberZNet 8.0.3 GA) bound at
# /dev/ttyUSB0 on the Pi.
namespace: hermod-prod
scale:
  hermod-coordinator: 0
  nanomq: 1
  vault42: 0
  postgres: 1
  lora2mqtt: 0
  wifi2mqtt: 0
  zigbee2mqtt: 1
  omg-ble: 0
