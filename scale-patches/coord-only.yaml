# coord-only — Coordinator + its dependencies, all translators OFF.
# Default for Phase A/B/C/D/G/H. The point is to measure the
# Coordinator's hot path without translator scheduler noise.
namespace: hermod-prod
scale:
  hermod-coordinator: 1
  nanomq: 1
  vault42: 0
  postgres: 1
  lora2mqtt: 0
  wifi2mqtt: 0
  zigbee2mqtt: 0
  omg-ble: 0
