# mosquitto-only — wifi2mqtt = Mosquitto, alone. RQ2 μ_mosquitto.
# wifi2mqtt's bridge to NanoMQ is wired in its configmap; with NanoMQ at 0
# the bridge will spin retry attempts. That CPU is part of "Mosquitto
# alone with bridge configured" reality. If bridge-retry CPU pollutes
# the measurement, the analyzer will flag it and we patch the configmap
# in a follow-up cycle.
namespace: hermod-prod
scale:
  hermod-coordinator: 0
  nanomq: 0
  vault42: 0
  postgres: 1
  lora2mqtt: 0
  wifi2mqtt: 1
  zigbee2mqtt: 0
  omg-ble: 0
