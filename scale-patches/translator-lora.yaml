# translator-lora — LoRa2MQTT + NanoMQ, no Coordinator.
# Real Waveshare SX1262 HAT bound at /dev/serial0 on the Pi;
# LoRa__MockMode=false in the prod overlay.
namespace: hermod-prod
scale:
  hermod-coordinator: 0
  nanomq: 1
  vault42: 0
  postgres: 1
  lora2mqtt: 1
  wifi2mqtt: 0
  zigbee2mqtt: 0
  omg-ble: 0
