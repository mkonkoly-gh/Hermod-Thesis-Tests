# Storage isolation: all features on, but storage_mode=Noop so every
# Postgres write is dropped in-memory. Upper bound on "coordinator cost
# minus DB cost". Pairing with baseline measures total DB cost.
name: storage-noop-kind-8gb
description: Baseline with storage_mode=Noop. Storage-cost total bound.
inherits_from: baseline-kind-8gb
claims: [C1, O5]
features:
  storage_mode: Noop
