# RQ9 deadlock-freedom on real Pi 5. Same shape as kind soak but μ on
# the Pi is lower; rate is calibrated during RQ1 and this profile takes
# the calibrated value via HERMOD_OVERRIDE_LOAD_RATE once measured.
# Default here holds if the Pi measures μ ≈ 1000 msg/s.
name: soak-rho09-pi5-live-8gb
description: Pi 5 8GB 5-min ρ=0.9 soak for φ_df verification.
inherits_from: baseline-pi5-live
load:
  devices: 300
  rate_per_device_hz: 3.0
  ramp_from_msg_per_sec: 100
run:
  warmup_sec: 30
  measure_sec: 300
  cooldown_sec: 30
  repeats: 1
