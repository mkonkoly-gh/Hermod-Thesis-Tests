# nanomq-only profile. Hand-written, frozen.
# Two workloads: postgres (cold, but kept for symmetry/probe), nanomq.
# No Coord — load_gen publishes to nanomq directly to measure broker
# baseline. NodePort 31883 plaintext.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nanomq-only
---
apiVersion: v1
kind: Secret
metadata:
  name: hermod-secrets
  namespace: nanomq-only
type: Opaque
stringData:
  mqtt-username: hermod
  mqtt-password: hermod-test
  postgres-superuser-password: postgres-test-pw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nanomq-config
  namespace: nanomq-only
data:
  nanomq.conf: |
    mqtt {
      property_size = 32
      max_packet_size = 256KB
      max_mqueue_len = 2048
      retry_interval = 10s
      keepalive_multiplier = 1.25
    }
    listeners.tcp { bind = "0.0.0.0:1883" }
    http_server {
      port = 8081
      limit_conn = 32
      username = admin
      password = admin-test
      auth_type = basic
    }
    log { to = [console]; level = error }
    auth { allow_anonymous = true; no_match = allow; deny_action = ignore }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nanomq-only
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: postgres }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: hermod-secrets, key: postgres-superuser-password } }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1536Mi, cpu: "1500m" }
          readinessProbe: { exec: { command: [pg_isready, -U, postgres] }, initialDelaySeconds: 5, periodSeconds: 5 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nanomq-only
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanomq
  namespace: nanomq-only
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nanomq } }
  template:
    metadata: { labels: { app: nanomq } }
    spec:
      containers:
        - name: nanomq
          image: emqx/nanomq:0.21-slim
          ports:
            - { name: mqtt, containerPort: 1883 }
            - { name: http, containerPort: 8081 }
          volumeMounts:
            - { name: config, mountPath: /etc/nanomq.conf, subPath: nanomq.conf }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 512Mi, cpu: 1 }
          readinessProbe: { tcpSocket: { port: 1883 }, initialDelaySeconds: 3, periodSeconds: 5 }
      volumes:
        - { name: config, configMap: { name: nanomq-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: nanomq
  namespace: nanomq-only
spec:
  type: NodePort
  selector: { app: nanomq }
  ports:
    - { name: mqtt, port: 1883, targetPort: 1883, nodePort: 31883 }
    - { name: http, port: 8081, targetPort: 8081 }
