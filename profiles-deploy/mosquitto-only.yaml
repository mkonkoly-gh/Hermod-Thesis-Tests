# mosquitto-only profile. Hand-written, frozen.
# Two workloads: postgres + mosquitto. Mosquitto serves plaintext on
# 1883, NodePort 31883 (same port as nanomq deployments — only one is
# applied at a time so no conflict). Lets us measure
# mosquitto-as-broker baseline.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mosquitto-only
---
apiVersion: v1
kind: Secret
metadata:
  name: hermod-secrets
  namespace: mosquitto-only
type: Opaque
stringData:
  postgres-superuser-password: postgres-test-pw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto-only
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    log_dest stdout
    log_type error
    log_type warning
    persistence false
    max_connections -1
    max_inflight_messages 200
    max_queued_messages 5000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mosquitto-only
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: postgres }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: hermod-secrets, key: postgres-superuser-password } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1536Mi, cpu: "1500m" }
          readinessProbe: { exec: { command: [pg_isready, -U, postgres] }, initialDelaySeconds: 5, periodSeconds: 5 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mosquitto-only
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto-only
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mosquitto } }
  template:
    metadata: { labels: { app: mosquitto } }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports: [{ name: mqtt, containerPort: 1883 }]
          volumeMounts:
            - { name: config, mountPath: /mosquitto/config/mosquitto.conf, subPath: mosquitto.conf }
          resources:
            requests: { memory: 32Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 1 }
          readinessProbe: { tcpSocket: { port: 1883 }, initialDelaySeconds: 3, periodSeconds: 5 }
      volumes:
        - { name: config, configMap: { name: mosquitto-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mosquitto-only
spec:
  type: NodePort
  selector: { app: mosquitto }
  ports: [{ name: mqtt, port: 1883, targetPort: 1883, nodePort: 31883 }]
