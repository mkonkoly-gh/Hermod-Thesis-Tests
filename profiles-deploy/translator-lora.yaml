# translator-lora profile. Hand-written, frozen.
# Full Coord stack + lora2mqtt in MOCK MODE running alongside.
# Measures Coord throughput when a lora2mqtt translator is co-resident.
---
apiVersion: v1
kind: Namespace
metadata: { name: translator-lora }
---
apiVersion: v1
kind: Secret
metadata: { name: hermod-secrets, namespace: translator-lora }
type: Opaque
stringData:
  mqtt-username: hermod
  mqtt-password: hermod-test
  postgres-superuser-password: postgres-test-pw
---
apiVersion: v1
kind: Secret
metadata: { name: hermod-db-credentials, namespace: translator-lora }
type: Opaque
stringData:
  hermod-db-password: hermod-test-db-pw
---
apiVersion: v1
kind: ConfigMap
metadata: { name: nanomq-config, namespace: translator-lora }
data:
  nanomq.conf: |
    mqtt { property_size = 32; max_packet_size = 256KB; max_mqueue_len = 2048; retry_interval = 10s; keepalive_multiplier = 1.25 }
    listeners.tcp { bind = "0.0.0.0:1883" }
    http_server { port = 8081; limit_conn = 32; username = admin; password = admin-test; auth_type = basic }
    log { to = [console]; level = error }
    auth { allow_anonymous = true; no_match = allow; deny_action = ignore }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: translator-lora }
data:
  init.sql: |
    CREATE DATABASE hermod;
    CREATE ROLE hermod_app WITH LOGIN PASSWORD 'hermod-test-db-pw';
    GRANT ALL PRIVILEGES ON DATABASE hermod TO hermod_app;
    \c hermod
    GRANT ALL ON SCHEMA public TO hermod_app;
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: translator-lora }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: postgres }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: hermod-secrets, key: postgres-superuser-password } }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1536Mi, cpu: "1500m" }
          readinessProbe: { exec: { command: [pg_isready, -U, postgres] }, initialDelaySeconds: 5, periodSeconds: 5 }
      volumes:
        - { name: init, configMap: { name: postgres-init } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: translator-lora }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nanomq, namespace: translator-lora }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nanomq } }
  template:
    metadata: { labels: { app: nanomq } }
    spec:
      containers:
        - name: nanomq
          image: emqx/nanomq:0.21-slim
          ports:
            - { name: mqtt, containerPort: 1883 }
            - { name: http, containerPort: 8081 }
          volumeMounts:
            - { name: config, mountPath: /etc/nanomq.conf, subPath: nanomq.conf }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 512Mi, cpu: 1 }
          readinessProbe: { tcpSocket: { port: 1883 }, initialDelaySeconds: 3, periodSeconds: 5 }
      volumes:
        - { name: config, configMap: { name: nanomq-config } }
---
apiVersion: v1
kind: Service
metadata: { name: nanomq, namespace: translator-lora }
spec:
  type: NodePort
  selector: { app: nanomq }
  ports:
    - { name: mqtt, port: 1883, targetPort: 1883, nodePort: 31883 }
    - { name: http, port: 8081, targetPort: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hermod-coordinator, namespace: translator-lora }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: hermod-coordinator } }
  template:
    metadata: { labels: { app: hermod-coordinator } }
    spec:
      initContainers:
        - { name: wait-for-postgres, image: busybox:1.36, command: [sh, -c, "until nc -z postgres 5432; do sleep 2; done"] }
        - { name: wait-for-nanomq,   image: busybox:1.36, command: [sh, -c, "until nc -z nanomq 1883; do sleep 2; done"] }
      containers:
        - name: hermod-coordinator
          image: hermod-coordinator:latest
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 42069 }]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: ASPNETCORE_URLS, value: "http://+:42069" }
            - { name: DOTNET_USE_POLLING_FILE_WATCHER, value: "true" }
            - { name: Hermod__Security__AuthBypass, value: "true" }
            - { name: Hermod__Security__VaultRequireHttps, value: "false" }
            - { name: Hermod__Features__MetricsEndpoint, value: "true" }
            - { name: Hermod__Dev__Endpoints, value: "true" }
            - { name: Hermod__Mqtt__Host, value: nanomq }
            - { name: Hermod__Mqtt__Port, value: "1883" }
            - { name: Hermod__Mqtt__UseTls, value: "false" }
            - { name: Hermod__Mqtt__Tls__UseTls, value: "false" }
            - name: Hermod__Mqtt__Username
              valueFrom: { secretKeyRef: { name: hermod-secrets, key: mqtt-username } }
            - name: Hermod__Mqtt__Password
              valueFrom: { secretKeyRef: { name: hermod-secrets, key: mqtt-password } }
            - { name: Hermod__Database__ConnectionString, value: "Host=postgres;Port=5432;Database=hermod;Username=hermod_app" }
            - name: Hermod__Database__Password
              valueFrom: { secretKeyRef: { name: hermod-db-credentials, key: hermod-db-password } }
          resources:
            requests: { memory: 256Mi, cpu: 200m }
            limits: { memory: 1536Mi, cpu: "1500m" }
          startupProbe: { httpGet: { path: /healthz, port: 42069, scheme: HTTP }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /healthz/ready, port: 42069, scheme: HTTP }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 42069, scheme: HTTP }, initialDelaySeconds: 60, periodSeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: hermod-coordinator, namespace: translator-lora }
spec:
  type: NodePort
  selector: { app: hermod-coordinator }
  ports: [{ name: http, port: 42069, targetPort: 42069, nodePort: 42069 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: lora2mqtt, namespace: translator-lora }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: lora2mqtt } }
  template:
    metadata: { labels: { app: lora2mqtt } }
    spec:
      containers:
        - name: lora2mqtt
          image: lora2mqtt:latest
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: LoRa__MockMode, value: "false" }
            - { name: LoRa__SerialPort, value: "/dev/ttyACM0" }
            - { name: Hermod__Security__AuthBypass, value: "true" }
            - { name: Hermod__Security__VaultRequireHttps, value: "false" }
            - { name: Hermod__Features__MetricsEndpoint, value: "true" }
            - { name: Hermod__Dev__Endpoints, value: "true" }
            - { name: Mqtt__Host, value: nanomq }
            - { name: Mqtt__Port, value: "1883" }
            - { name: Mqtt__Tls__UseTls, value: "false" }
            - name: Mqtt__Username
              valueFrom: { secretKeyRef: { name: hermod-secrets, key: mqtt-username } }
            - name: Mqtt__Password
              valueFrom: { secretKeyRef: { name: hermod-secrets, key: mqtt-password } }
          securityContext: { privileged: true }
          volumeMounts:
            - { name: lora-device, mountPath: /dev/ttyACM0 }
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 500m }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
      volumes:
        - name: lora-device
          hostPath: { path: /dev/ttyACM0, type: CharDevice }
